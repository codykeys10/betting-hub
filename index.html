<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CB BETTING HUB</title>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --bg-dark: #0b0f19;
            --card-bg: rgba(23, 32, 54, 0.7);
            --win-color: #00e676;
            --loss-color: #ff5252;
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text); padding-bottom: 40px; }

        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            padding: 25px 15px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        header h1 { font-size: 24px; color: var(--primary); margin-bottom: 4px; }
        header p { font-size: 12px; color: #94a3b8; margin-bottom: 15px; }

        .status-tracker { display: flex; justify-content: center; gap: 8px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
        .dot.win { background-color: var(--win-color); box-shadow: 0 0 8px var(--win-color); }
        .dot.loss { background-color: var(--loss-color); box-shadow: 0 0 8px var(--loss-color); }

        .container { max-width: 480px; margin: 20px auto; padding: 0 15px; }
        .container h2 { font-size: 16px; margin-bottom: 15px; color: #cbd5e1; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-img-box { width: 100%; max-height: 200px; overflow: hidden; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 15px; }

        .card-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .company-tag {
            background: rgba(0, 242, 254, 0.15);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
        }

        .odds-tag {
            background: rgba(0, 230, 118, 0.15);
            color: var(--win-color);
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
        }

        .code-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .code-text { font-family: monospace; font-size: 16px; font-weight: bold; color: #fff; }

        .btn-copy {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header class="glass-header">
        <div class="badge"><i class="fa-solid fa-fire"></i> DAILY WINNING TIPS</div>
        <h1>CB BETTING HUB</h1>
        <p>Matokeo ya Siku 10 Zilizopita (Win / Loss)</p>
        <div class="status-tracker" id="statusTracker"></div>
    </header>

    <main class="container">
        <h2><i class="fa-solid fa-ticket"></i> Mikeka ya Leo</h2>
        <div id="betsContainer"></div>
    </main>

    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                renderStatus(data.status);
                renderBets(data.bets);
            } catch (error) {
                console.error("Haitawezekana kupakia data:", error);
            }
        }

        function renderStatus(statusList) {
            const tracker = document.getElementById('statusTracker');
            if(!tracker || !statusList) return;
            tracker.innerHTML = '';
            statusList.forEach(status => {
                const dot = document.createElement('span');
                dot.className = `dot ${status.toUpperCase() === 'W' ? 'win' : 'loss'}`;
                tracker.appendChild(dot);
            });
        }

        function renderBets(betsList) {
            const container = document.getElementById('betsContainer');
            if(!container) return;
            container.innerHTML = '';

            if(!betsList || betsList.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#64748b; margin-top:20px;">Hakuna mkeka uliopostiwa leo.</p>`;
                return;
            }

            betsList.forEach(bet => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${bet.img ? `<div class="card-img-box"><img src="${bet.img}" alt="Mkeka"></div>` : ''}
                    <div class="card-body">
                        <div class="card-header-info">
                            <span class="company-tag">${bet.company}</span>
                            <span class="odds-tag">Total Odds: ${bet.odds}</span>
                        </div>
                        <p style="font-size:13px; color:#cbd5e1; margin-bottom:8px;">${bet.desc}</p>
                        <div class="code-box">
                            <span>Booking Code:</span>
                            <span class="code-text">${bet.code}</span>
                        </div>
                        <button type="button" class="btn-copy" onclick="copyCode('${bet.code}')">
                            <i class="fa-regular fa-copy"></i> Copy Code
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyCode(text) {
            navigator.clipboard.writeText(text);
        }

        document.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
