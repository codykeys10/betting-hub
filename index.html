<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CB BETTING HUB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0b132b;
      color: #ffffff;
      padding-bottom: 40px;
    }
    header {
      text-align: center;
      padding: 25px 15px;
      background: #1c2541;
      border-bottom: 2px solid #00f2fe;
    }
    header h1 {
      color: #00f2fe;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .badge-daily {
      background: #ff4757;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
    }
    .section-title {
      font-size: 18px;
      margin: 20px 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e0e6ed;
    }
    .bet-card {
      background: #1c2541;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border: 1px solid #3a506b;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .company-badge {
      background: #00f2fe;
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .odds-badge {
      background: #10b981;
      color: #fff;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .code-box {
      background: #0b132b;
      border: 1px dashed #00f2fe;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }
    .code-text {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #fff;
    }
    .copy-btn {
      background: #00f2fe;
      color: #000;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    .history-card {
      background: #1c2541;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #10b981;
    }
    .history-card.lost {
      border-left-color: #ef4444;
    }
    .result-tag {
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #000;
    }
    .result-won {
      background: #10b981;
      color: #fff;
    }
    .result-lost {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <span class="badge-daily">🔥 DAILY WINNING TIPS</span>
    <h1>CB BETTING HUB</h1>
  </header>

  <div class="container">
    <!-- Sehemu ya Mikeka ya Leo -->
    <div class="section-title">📺 Mikeka ya Leo</div>
    <div id="bets-container">
      <p style="text-align: center; color: #94a3b8;">Inapakua mikeka...</p>
    </div>

    <!-- Sehemu ya History -->
    <div class="section-title" style="margin-top: 30px;">📜 History ya Mikeka Iliyopita</div>
    <div id="history-container">
      <p style="text-align: center; color: #94a3b8;">Inapakua history...</p>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('data.json');
        const data = await response.json();

        // Render Mikeka ya Leo
        const betsContainer = document.getElementById('bets-container');
        betsContainer.innerHTML = '';

        if (data.bets && data.bets.length > 0) {
          data.bets.forEach(bet => {
            const card = `
              <div class="bet-card">
                <div class="card-header">
                  <span class="company-badge">${bet.company}</span>
                  <span class="odds-badge">Total Odds: ${bet.odds}</span>
                </div>
                <div style="font-size: 14px; color: #cbd5e1; margin-bottom: 8px;">${bet.desc}</div>
                <div class="code-box">
                  <span style="color: #94a3b8; font-size: 12px;">Booking Code:</span>
                  <span class="code-text">${bet.code}</span>
                </div>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${bet.code}'); alert('Code ime-kopiwa: ${bet.code}');">
                  📋 Copy Code
                </button>
              </div>
            `;
            betsContainer.innerHTML += card;
          });
        } else {
          betsContainer.innerHTML = '<p style="color: #94a3b8;">Hakuna mkeka uliowekwa kwa leo.</p>';
        }

        // Render History
        const historyContainer = document.getElementById('history-container');
        historyContainer.innerHTML = '';

        if (data.history && data.history.length > 0) {
          data.history.forEach(item => {
            const isWin = item.result.toUpperCase() === 'WON';
            const cardClass = isWin ? '' : 'lost';
            const tagClass = isWin ? 'result-won' : 'result-lost';

            const historyCard = `
              <div class="history-card ${cardClass}">
                <div>
                  <small style="color: #94a3b8;">${item.date} • ${item.company}</small>
                  <div style="color: #fff; font-weight: bold; font-size: 14px; margin: 3px 0;">${item.desc}</div>
                  <small style="color: #00f2fe; font-weight: bold;">Odds: ${item.odds}</small>
                </div>
                <div>
                  <span class="result-tag ${tagClass}">${item.result}</span>
                </div>
              </div>
            `;
            historyContainer.innerHTML += historyCard;
          });
        } else {
          historyContainer.innerHTML = '<p style="color: #94a3b8;">Hakuna history kwa sasa.</p>';
        }

      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    loadData();
  </script>
</body>
</html>
